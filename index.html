<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food-ctrl AI Pro</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 18px; color: #1a73e8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat { background: #e8f0fe; padding: 15px; border-radius: 10px; text-align: center; }
        .stat.alert { background: #fce8e6; color: #d93025; }
        .label { font-size: 11px; text-transform: uppercase; color: #5f6368; display: block; }
        .value { font-size: 20px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #ccc; }
        #settings-btn { background: none; color: #1a73e8; font-size: 12px; text-decoration: underline; border: none; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        li { background: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 5px solid #1a73e8; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🍏 Food-ctrl AI</h1>

    <div id="setup-card" class="card">
        <h2>Configuració</h2>
        <p style="font-size: 12px;">Enganxa la teva API Key de Google AI Studio:</p>
        <input type="password" id="api-key" placeholder="AIzaSy...">
        <button onclick="saveKey()">Desar Clau</button>
    </div>

    <div id="main-app" class="card hidden">
        <h2>Resum d'Avui</h2>
        <div class="grid">
            <div class="stat" id="box-p"> <span class="label">Punts</span> <span class="value" id="v-p">29/29</span> </div>
            <div class="stat" id="box-e"> <span class="label">Extres</span> <span class="value" id="v-e">12/12</span> </div>
            <div class="stat"> <span class="label">Calories</span> <span class="value" id="v-k">1800</span> </div>
            <div class="stat"> <span class="label">Proteïna</span> <span class="value" id="v-pr">140g</span> </div>
        </div>
        
        <textarea id="userInput" placeholder="Ex: M'he menjat 2 cafès amb llet i una taronja..."></textarea>
        <button id="sendBtn" onclick="askAI()">🚀 Calcular amb IA</button>
        <button id="settings-btn" onclick="showSetup()">Canviar API Key</button>
    </div>

    <div class="card">
        <h2>Historial</h2>
        <ul id="log"></ul>
    </div>

    <script>
        let KEY = localStorage.getItem('gemini_key');
        const limits = { p: 29, e: 12, k: 1800, pr: 140, g: 55 };
        let consumed = { p: 0, e: 0, k: 0, pr: 0, g: 0 };

        if(KEY) showApp();

        function saveKey() {
            KEY = document.getElementById('api-key').value;
            localStorage.setItem('gemini_key', KEY);
            showApp();
        }

function saveKey() {
            // El .trim() elimina qualsevol espai accidental al principi o al final
            KEY = document.getElementById('api-key').value.trim(); 
            localStorage.setItem('gemini_key', KEY);
            showApp();
        }

        function showSetup() {
            document.getElementById('setup-card').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }

        async function askAI() {
            const input = document.getElementById('userInput').value;
            const btn = document.getElementById('sendBtn');
            if(!input) return;

            btn.disabled = true;
            btn.innerText = "Pensant...";

            const prompt = `Ets Food-ctrl, expert en dieta Enlínia. Analitza: "${input}". 
            Usa aquestes regles: 
            - Cafè amb llet (125ml): 2 pts, 60 kcal, 4g prot, 4g greix.
            - Taronja: 0 pts, 60 kcal, 1g prot.
            - Galtes porc (100g): 5 pts, 250 kcal, 15g prot.
            - Cervesa (330ml): 5 pts, 150 kcal.
            - Olives (8 verdes): 1 pt.
            - Raïm/Fruita: 0 pts (fins a 3/dia).
            Si no coneixes l'aliment, estima segons la lògica de 1 punt = 40 kcal aprox (però greixos sumen més).
            RESPON ÚNICAMENT I EXCLUSIVAMENT AMB UN OBJECTE JSON. NO AFEGEIXIS CAP TEXT ABANS NI DESPRÉS. FORMAT ESPERAT: {"nom": "títol", "punts": 0, "kcal": 0, "prot": 0, "greixos": 0}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    throw new Error("Clau d'API incorrecta o error de Google.");
                }

                const data = await response.json();
                let text = data.candidates[0].content.parts[0].text;
                
                // Neteja extrema per caçar només el JSON
                let jsonInici = text.indexOf('{');
                let jsonFi = text.lastIndexOf('}') + 1;
                let jsonNet = text.substring(jsonInici, jsonFi);
                
                const res = JSON.parse(jsonNet);
                updateStats(res);
                
            } catch (e) {
                console.error(e);
                alert("Error: Revisa que la API Key sigui correcta (sense espais) o prova-ho de nou en uns segons.");
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 Calcular amb IA";
                document.getElementById('userInput').value = "";
            }
        }
    </script>
</body>
</html>
